<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d17" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="英语地下城" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <title>英语地下城</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d17; overflow: hidden; overscroll-behavior: none; }
      /* 平板：禁止双击放大、长按选字、长按弹菜单；输入框弹窗里仍可选字 */
      body { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #game { width: 100%; height: 100%; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; }
      #game canvas { touch-action: none; }
      /* 竖着拿平板时提示横过来 */
      #rotate { display: none; position: fixed; inset: 0; z-index: 2000; background: #0b0d17; color: #dfe4ff; align-items: center; justify-content: center; flex-direction: column; gap: 14px; font: 24px 'PingFang SC','Microsoft YaHei',sans-serif; text-align: center; }
      #rotate b { font-size: 64px; display: block; animation: spin 2.4s ease-in-out infinite; }
      @keyframes spin { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"><b>📱</b>请把平板横过来玩</div>
    <div id="boot-msg" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#cfd6ff;font:20px 'PingFang SC','Microsoft YaHei',sans-serif">英语地下城 加载中…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
